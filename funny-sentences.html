function shuffled(list){return list.slice().sort(function(){return Math.random()-.5})}
function choicesFor(word,i,count){const base=[word].concat((d.wordLibrary[i]||[]).filter(function(part){return part!==word}));const opposite=(opposites[word]||[]).filter(function(part){return base.includes(part)});const rest=base.filter(function(part){return part!==word&&!opposite.includes(part)});return [word].concat(antonymMode?shuffled(opposite):[]).concat(shuffled(rest)).slice(0,count)}function partStatus(part,i,used){if(!part)return ['',''];if((d.wordLibrary[i]||[]).includes(part))return used[i].has(part)?['登録されています','used']:['登録済み・使用可能','available'];return ['新規パーツとして登録します','new']}
function choose(slot){selectedSlot=slot;notice=`言葉${slot+1}を選択中です。下の未使用パーツを1回タップすると差し替わります。`;draw()}

function replacePart(slot,word){if(usageWithDrafts()[slot].has(word)){notice='この候補はすでに使用中です。';draw();return}const w=current(),from=drafts[slot]?.from??w[slot];drafts[slot]={from,to:word};w[slot]=word;selectedSlot=slot;notice='差し替えました。変更を保存すると主軸セット全体に反映されます。';draw()}
