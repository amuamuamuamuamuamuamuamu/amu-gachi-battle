<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>あむガチバトル</title><style>:root{--p:#24123d;--p2:#43206b;--g:#f4cf67;--k:#f06aa8;--gr:#57c985;--paper:#fffaf0}*{box-sizing:border-box}body{margin:0;background:#218c5a;font-family:system-ui,"Noto Sans JP",sans-serif;color:var(--p)}.page{max-width:620px;margin:auto;padding:12px}.card{position:relative;background:var(--paper);border:3px solid var(--g);border-radius:20px;padding:20px;box-shadow:0 8px 25px #10051e88}.close{position:absolute;right:12px;top:12px;width:40px;height:40px;border:2px solid var(--p);border-radius:50%;background:var(--g);font-size:25px;font-weight:900}.logo{width:120px;height:54px;object-fit:contain;display:block}.hidden{display:none!important}h1{text-align:center;margin:8px 0 18px}.center{text-align:center}.actions,.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:2px solid var(--p);border-radius:12px;padding:13px;font-weight:900;cursor:pointer;background:#fff}.pink{background:var(--k);color:#fff}.gold{background:var(--g)}.purple{background:var(--p2);color:#fff}.green{background:var(--gr)}.monster-img{display:block;width:100%;height:260px;object-fit:contain}.name{font-size:36px;text-align:center;font-weight:900}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat,.tile{border:1px solid #c8aa59;border-radius:8px;padding:8px}.bar,.match{height:9px;background:#eadfc5;border-radius:9px;overflow:hidden}.fill,.match div{height:100%;background:linear-gradient(90deg,var(--k),var(--g))}.tile{text-align:center}.tile.selected{border:3px solid var(--k)}.tile img{height:120px;width:100%;object-fit:contain}.stage,.camera{width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden}.stage{position:relative;background:url('指をおく背景.jpg') center/cover;touch-action:none}.dot{position:absolute;width:42px;height:42px;border-radius:50%;border:3px solid white;transform:translate(-50%,-50%);box-shadow:0 0 25px 12
