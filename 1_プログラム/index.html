<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>あむ召喚</title><style>body{font-family:system-ui;margin:0;background:#e7f7ff;color:#17233d}.page{min-height:100vh;display:grid;place-items:center;padding:12px}.card{width:min(680px,100%);background:#fff;border:2px solid #17233d;border-radius:20px;padding:22px;box-sizing:border-box}.hidden{display:none!important}h1{text-align:center}button,input{font:inherit}button{width:100%;padding:11px;margin:4px 0;border:2px solid #17233d;border-radius:10px;font-weight:900}.primary{background:#f24f9f;color:#fff}.secondary{background:#8ceeff}.admin-links,.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.monster{display:block;width:100%;height:300px;object-fit:contain}.monster-name{text-align:center;font-size:48px}.meta{text-align:center}.meta span{margin:5px}.feeling{text-align:center;padding:10px;background:#fff0f8}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{border:1px solid #b9d6ee;padding:7px}.bar{height:9px;background:#dcebf4}.fill{height:100%;background:#f24f9f}.notice{text-align:center}</style></head><body><main class="page"><section id="admin" class="card"><h1>空いているアカウントを選んでください</h1><div class="admin-links"><button class="primary room" data-room="1">1　空いている</button><button class="secondary room" data-room="2">2　空いている</button><button class="secondary room" data-room="3">3　空いている</button><button class="secondary room" data-room="4">4　空いている</button><button class="secondary room" data-room="5">5　空いている</button><button class="secondary room" data-room="6">6　空いている</button><button class="secondary room" data-room="7">7　空いている</button><button class="secondary room" data-room="8">8　空いている</button><button class="secondary room" data-room="9">9　空いている</button><button class="secondary room" data-room="10">10　空いている</button></div></section><section id="start" class="card hidden"><h1>あむ召喚</h1><p>召喚士の名前を入力してください。</p><input id="player" maxlength="12" placeholder="召喚士の名前"><button id="summon" class="primary" disabled>モンスターを召喚する</button><button id="backAdmin" class="secondary">管理画面へ戻る</button></section><section id="game" class="card hidden"><div>召喚士：<b id="playerName"></b></div><img id="monster" class="monster"><h1 id="monsterName" class="monster-name"></h1><div class="meta"><span id="level"></span><span id="stage"></span><span>召喚中</span></div><div id="feeling" class="feeling"></div><div id="stats" class="stats"></div><div class="actions"><button id="evolve" class="secondary">進化させる</button><button id="replace" class="primary">モンスター交代</button></div><p id="notice" class="notice"></p><div id="log"></div><button id="gameAdmin" class="secondary">管理画面へ戻る</button></section></main><script src="game-data.js"></script><script src="app.js"></script></body></html>
